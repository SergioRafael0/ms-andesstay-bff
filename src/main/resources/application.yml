server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: ms-andesstay-bff
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ENTRA_ISSUER_URI:https://login.microsoftonline.com/TU_TENANT_ID/v2.0}
          jwk-set-uri: ${ENTRA_JWK_SET_URI:https://login.microsoftonline.com/TU_TENANT_ID/discovery/v2.0/keys}

andesstay:
  microservices:
    reservations-url: ${MS_RESERVATIONS_URL:http://localhost:8081/api/reservations}
    catalog-url: ${MS_CATALOG_URL:http://localhost:8082/api/catalog}
  security:
    audience: ${ENTRA_AUDIENCE:api://andesstay-api}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.security: INFO
    cl.andesstay: DEBUG
